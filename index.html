<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087f75"><title>コピーボタン管理</title><link rel="stylesheet" href="styles.css?v=20260819-2"><style>.categoryGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));align-items:start;gap:12px}.categoryColumn{display:flex;flex-direction:column;gap:7px;min-width:0}.categoryTitle{min-height:32px;margin:0;padding:7px 10px;display:flex;align-items:center;background:#dce6f0;border-left:4px solid #182433;border-radius:3px;font-size:13px;font-weight:700}.categoryTitleEditing{padding:4px 7px;gap:7px}.categoryDragHandle{color:#fff;touch-action:none;cursor:grab;background:#182433;border:0;border-radius:5px;width:24px;height:24px;line-height:1;font-size:16px}.categoryButtons{display:flex;flex-direction:column;gap:7px}.categoryButtons .copyCard{width:100%}.tooltipNote,.tooltipCopy{display:block}.tooltipNote{font-weight:700}.tooltip.hasNote .tooltipCopy{margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.28)}@media(max-width:700px){.modal input:not([type=radio]),.modal textarea{font-size:16px}.categoryGrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.categoryColumn,.categoryButtons{gap:6px}.categoryTitle{min-height:30px;padding:6px 8px;font-size:12px}.categoryTitleEditing{padding:3px 5px}.categoryDragHandle{width:24px;height:24px}}@media(max-width:430px){.categoryGrid{grid-template-columns:1fr}}</style></head><body><main>
