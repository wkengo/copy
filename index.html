<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087f75"><title>コピーボタン管理</title><link rel="stylesheet" href="styles.css"></head><body><main>
<header class="topbar"><div class="brand"><span class="brandMark">C</span><div><h1>Copy Buttons</h1><p>よく使う文字列を、ワンタップでコピー</p></div></div><nav class="actions" aria-label="データ操作"><input id="csv-file" type="file" accept=".csv,text/csv" hidden><button class="actionButton" id="import"><span>⇧</span> インポート</button><button class="actionButton" id="export"><span>⇩</span> エクスポート</button><button class="editToggle" id="edit">編集</button></nav></header>
<section class="workspace"><div class="sectionHeading"><div><span class="eyebrow">MY CLIPBOARD</span><h2>コピーボタン</h2></div><span class="count" id="count"></span></div><div id="content"></div></section><button class="addButton" id="add" aria-label="新しいボタンを追加">＋</button><div id="modal-root"></div><div id="toast-root"></div>
</main><script src="app.js"></script></body></html>
